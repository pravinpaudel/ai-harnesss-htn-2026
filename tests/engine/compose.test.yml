# Contract-schema test database for Developer B.
#   docker compose -f tests/engine/compose.test.yml up -d
# Tests apply contracts/schema.sql + grants.sql themselves and reset the schema per session.
services:
  htn-test-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: htn_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d htn_test"]
      interval: 2s
      timeout: 3s
      retries: 20
