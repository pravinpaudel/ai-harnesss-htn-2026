<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="title description">
  <title id="title">FinRet</title>
  <desc id="description">FinRet, an evidence-first financial research desk, presented with the RBC logo.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001c44"/>
      <stop offset="0.55" stop-color="#003b73"/>
      <stop offset="1" stop-color="#005daa"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#00152d" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1500" height="1000" fill="url(#background)"/>
  <circle cx="-100" cy="1020" r="620" fill="#ffffff" fill-opacity="0.035"/>
  <circle cx="1450" cy="-90" r="530" fill="#ffd200" fill-opacity="0.06"/>
  <path d="M0 780C270 620 450 670 680 570S1070 340 1500 430" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>
  <path d="M0 840C300 670 495 740 735 630S1120 390 1500 490" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="2"/>

  <g transform="translate(120 148)">
    <rect width="86" height="8" rx="4" fill="#ffd200"/>
    <text x="0" y="162" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="142" font-weight="700" letter-spacing="-6">FinRet</text>
    <text x="3" y="224" fill="#ffd200" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" letter-spacing="5">RESEARCH DESK</text>
    <line x1="0" y1="281" x2="690" y2="281" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <text x="0" y="354" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400">Evidence-first financial research</text>
    <text x="0" y="402" fill="#d5e7f8" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Cited answers. Clear sources. Faster decisions.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1045" y="118" width="325" height="764" rx="36" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
    <image href="../web/public/rbc-logo.png" x="1083" y="188" width="249" height="311" preserveAspectRatio="xMidYMid meet"/>
    <line x1="1102" y1="574" x2="1313" y2="574" stroke="#ffd200" stroke-width="5" stroke-linecap="round"/>
    <text x="1208" y="650" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" letter-spacing="3">POWERED BY</text>
    <text x="1208" y="700" fill="#dcecf9" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" text-anchor="middle">RBC</text>
    <text x="1208" y="748" fill="#dcecf9" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">Built for the</text>
    <text x="1208" y="778" fill="#dcecf9" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">investment workflow</text>
  </g>

  <text x="121" y="886" fill="#d5e7f8" fill-opacity="0.76" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" letter-spacing="2">FINANCE RESEARCH, BUILT FOR TRACEABILITY</text>
</svg>
