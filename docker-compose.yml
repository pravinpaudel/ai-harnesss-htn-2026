services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: harness
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    environment:
      HARNESS_DATABASE_URL: postgresql+psycopg://harness:harness@postgres:5432/harness
      HARNESS_RAW_STORAGE_PATH: /data/raw
    ports: ["8000:8000"]
    volumes: ["./:/workspace", "raw-data:/data/raw"]
    working_dir: /workspace
    depends_on:
      postgres: { condition: service_healthy }
  worker:
    build: .
    command: python -m app.worker.main
    environment:
      HARNESS_DATABASE_URL: postgresql+psycopg://harness:harness@postgres:5432/harness
      HARNESS_RAW_STORAGE_PATH: /data/raw
    volumes: ["./:/workspace", "raw-data:/data/raw"]
    working_dir: /workspace
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres-data:
  raw-data:
